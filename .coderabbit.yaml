version: 2
language: es-ES
tone_instructions: >-
  Escribe las revisiones en español claro y conciso. Prioriza errores funcionales, seguridad,
  regresiones y problemas de datos; evita comentarios de estilo que ya cubren ESLint y Prettier.

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!public/**"
    - "!drizzle/meta/**"
    - "!pnpm-lock.yaml"
    - "!.open-next/**"
    - "!node_modules/**"
  path_instructions:
    - path: "**/*"
      instructions: |
        Sigue las convenciones de AGENTS.md y la arquitectura descrita en docs/spec.md.
        Para decisiones arquitectónicas, consulta los ADR de docs/adr/. No propongas hacer
        commits ni pushes: el usuario realiza esas operaciones manualmente.
    - path: "src/**/*.ts"
      instructions: |
        Mantén TypeScript estricto. Evita any, aserciones injustificadas y non-null assertions.
        Valida entradas externas con Zod. La lógica de dominio debe ser pura y sin I/O.
    - path: "src/**/*.tsx"
      instructions: |
        Mantén componentes accesibles, responsive y sin lógica de autorización basada solo en la UI.
        Evita renderizar datos privados si no hay sesión válida.
    - path: "src/app/api/**"
      instructions: |
        Comprueba sesión, permisos y propiedad del recurso en el servidor; no confíes en la UI.
        Valida cuerpos y parámetros con Zod y no expongas secretos ni información privada.
    - path: "src/modules/*/domain/**"
      instructions: |
        Mantén este código determinista y sin acceso a base de datos, red o APIs externas.
    - path: "drizzle/**"
      instructions: |
        Revisa que las migraciones sean compatibles con los datos existentes y no destructivas
        sin una estrategia explícita de migración o conservación de datos.
